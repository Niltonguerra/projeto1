# services/crawler-service-config.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-service
  namespace: services
spec:
  replicas: 2
  selector:
    matchLabels:
      app: crawler-service
  template:
    metadata:
      labels:
        app: crawler-service
    spec:
      containers:
        - name: crawler-service
          image: banco/crawler-service:latest
          imagePullPolicy: IfNotPresent  # usar local no dev
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: url
            - name: RABBITMQ_URL
              value: amqp://admin:sua_senha@rabbitmq.infra.svc.cluster.local:5672
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: crawler-service
  namespace: services
spec:
  selector:
    app: crawler-service
  ports:
    - port: 3000
      targetPort: 3000
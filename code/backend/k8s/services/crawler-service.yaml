apiVersion: apps/v1
kind: Deployment
metadata:
  name: crawler-service
  namespace: services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crawler-service
  template:
    metadata:
      labels:
        app: crawler-service
    spec:
      containers:
        - name: crawler-service
          image: banco/crawler-service:latest
          imagePullPolicy: Never   # obrigatório pra imagem local no kind
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: crawler-service
  namespace: services
spec:
  selector:
    app: crawler-service
  ports:
    - port: 3000
      targetPort: 3000
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-service
  namespace: services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-service
  template:
    metadata:
      labels:
        app: scheduler-service
    spec:
      containers:
        - name: scheduler-service
          image: banco/scheduler-service:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3501
          readinessProbe:
            httpGet:
              path: /health
              port: 3501
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3501
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-service
  namespace: services
spec:
  selector:
    app: scheduler-service
  ports:
    - port: 3501
      targetPort: 3501
